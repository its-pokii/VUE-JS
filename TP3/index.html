
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des tâches</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f8f9fa;
    }

    h1 {
      color: #333;
    }

    .filters {
      margin-bottom: 20px;
    }

    button {
      padding: 8px 14px;
      margin-right: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      border-radius: 5px;
    }

    .task {
      background-color: white;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .completed {
      color: green;
      font-weight: bold;
    }

    .not-completed {
      color: red;
      font-weight: bold;
    }

    .completed-btn {
      color: green;
      border: 1px solid green;
      background-color: #e8f5e9;
    }

    .completed-btn:hover {
      background-color: #c8e6c9;
    }

    .filter-btn {
      background-color: #e9ecef;
      border: 1px solid #ccc;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>Liste des tâches</h1>

    <h3>Nombre total de tâches : {{ TaskList.length }}</h3>

    <h3>Filtrer les tâches :</h3>

    <div class="filters">
      <button class="filter-btn completed-btn" @click="completed = true">
        Completed
      </button>

      <button class="filter-btn not-completed" @click="completed = false">
        Not Completed
      </button>

      <button class="filter-btn" @click="completed = null">
        All
      </button>
    </div>

    <div
      class="task"
      v-for="task in filteredTasks"
      :key="task.id"
    >
      <h3>{{ task.id }} - {{ task.title }}</h3>

      <p>{{ task.description }}</p>

      <p>
        Status:
        <span
          :class="task.completed ? 'completed' : 'not-completed'"
        >
          {{ task.completed ? 'Completed' : 'Not Completed' }}
        </span>
      </p>

      <button
        class="completed-btn"
        v-show="!task.completed"
        @click="markAsCompleted(task.id)"
      >
        Completed
      </button>
    </div>

    <p v-if="filteredTasks.length === 0">
      Aucune tâche à afficher.
    </p>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          completed: null,

          TaskList: [
            {
              id: 1,
              title: "Faire les courses",
              description: "Acheter des légumes et du lait.",
              completed: false
            },
            {
              id: 2,
              title: "Faire du sport",
              description: "Courir pendant 30 minutes.",
              completed: true
            },
            {
              id: 3,
              title: "Réviser pour l'examen",
              description: "Relire le chapitre 5 du manuel.",
              completed: false
            }
          ]
        };
      },

      computed: {
        filteredTasks() {
          if (this.completed === null) {
            return this.TaskList;
          }

          return this.TaskList.filter(
            task => task.completed === this.completed
          );
        }
      },

      methods: {
        markAsCompleted(taskId) {
          const task = this.TaskList.find(
            t => t.id === taskId
          );

          if (task) {
            task.completed = true;
          }
        }
      }
    });

    app.mount("#app");
  </script>
</body>
</html>
